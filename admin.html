<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">

    <title>إدارة XCITY</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-main {
            max-width: 1200px;
            margin: 35px auto;
            padding: 20px;
        }

        .admin-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .admin-heading h1 {
            margin: 0;
            color: #ff3030;
        }

        .admin-section {
            background: var(--card-bg, #1e1e1e);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .admin-section h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .admin-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .admin-form .full-width {
            grid-column: 1 / -1;
        }

        .admin-form label {
            display: block;
            margin-bottom: 7px;
        }

        .admin-form input,
        .admin-form textarea,
        .admin-form select {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #444;
            background: #121212;
            color: white;
            font: inherit;
        }

        .admin-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .admin-button {
            border: 0;
            padding: 12px 20px;
            border-radius: 7px;
            background: #ff3030;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        .admin-button:hover {
            opacity: .85;
        }

        .admin-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
        }

        .admin-video-list {
            display: grid;
            gap: 15px;
        }

        .admin-video-card {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 15px;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 10px;
        }

        .admin-video-card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 7px;
        }

        .admin-video-card h3 {
            margin-top: 0;
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .admin-actions button {
            padding: 8px 13px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
        }

        .approve-button {
            background: #168b50;
            color: white;
        }

        .reject-button {
            background: #bd3030;
            color: white;
        }

        .edit-button {
            background: #d18a16;
            color: white;
        }

        .delete-button {
            background: #555;
            color: white;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .admin-tabs button {
            padding: 10px 17px;
            border: 1px solid #444;
            border-radius: 7px;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font: inherit;
        }

        .admin-tabs button.active {
            background: #ff3030;
            border-color: #ff3030;
            color: white;
        }

        .admin-empty {
            text-align: center;
            padding: 25px;
            color: #999;
        }

        @media (max-width: 650px) {
            .admin-form {
                grid-template-columns: 1fr;
            }

            .admin-form .full-width {
                grid-column: auto;
            }

            .admin-video-card {
                grid-template-columns: 1fr;
            }

            .admin-video-card img {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="site-header">

    <div class="header-top">

        <button id="themeToggle" class="header-icon"
                aria-label="تغيير المظهر">☀</button>

        <a href="index.html" class="logo">
            <span>X</span><strong>CITY</strong>
        </a>

        <a href="index.html" class="header-icon"
           aria-label="العودة للموقع">⌂</a>

    </div>

</header>

<main class="admin-main">

    <div class="admin-heading">
        <h1>لوحة إدارة XCITY</h1>
        <button id="logoutButton" class="admin-button">
            تسجيل الخروج
        </button>
    </div>

    <section class="admin-section">

        <h2 id="formHeading">إضافة فيديو جديد</h2>

       <form id="videoForm" class="admin-form">

    <input type="hidden" id="videoId">

    <div class="full-width">
        <label for="videoTitle">عنوان الفيديو</label>
        <input type="text" id="videoTitle" required
               placeholder="أدخل عنوان الفيديو">
    </div>

    <div class="full-width">
        <label for="videoDescription">الوصف</label>
        <textarea id="videoDescription"
                  placeholder="وصف الفيديو"></textarea>
    </div>

    <!-- الكلمات المفتاحية -->
    <div class="full-width">
        <label for="videoKeywords">الكلمات المفتاحية</label>
        <textarea id="videoKeywords"
                  placeholder="مثال: رياضة، كرة قدم، أهداف، مباريات"></textarea>
        <small>افصل بين الكلمات بفواصل.</small>
    </div>

    <div>
        <label for="videoCategory">التصنيف</label>
        <select id="videoCategory" required>
            <option value="">اختر التصنيف</option>
        </select>
    </div>

    <div>
        <label for="videoDuration">مدة الفيديو بالثواني</label>
        <input type="number" id="videoDuration"
               min="0" placeholder="مثال: 600">
    </div>

    <div class="full-width">
        <label for="videoCover">رابط صورة الغلاف</label>
        <input type="url" id="videoCover"
               placeholder="https://example.com/cover.jpg">
    </div>

    <div class="full-width">
        <label for="videoUrl">رابط تشغيل الفيديو</label>
        <input type="url" id="videoUrl" required
               placeholder="رابط الفيديو المباشر">
    </div>

    <!-- خيارات النشر -->
    <div class="form-group">
        <label for="publishMode">طريقة النشر</label>
        <select id="publishMode">
            <option value="immediate">نشر فوري</option>
            <option value="scheduled">جدولة النشر</option>
        </select>
    </div>

    <div class="form-group" id="scheduleDateGroup"
         style="display: none;">
        <label for="scheduledAt">تاريخ ووقت النشر</label>
        <input type="datetime-local" id="scheduledAt">
    </div>

    <div class="full-width">
        <button type="submit" id="saveVideoButton"
                class="admin-button">
            حفظ الفيديو
        </button>

        <button type="button" id="cancelEditButton"
                class="admin-button"
                style="display:none;background:#555;">
            إلغاء التعديل
        </button>
    </div>

</form>

        <div id="formMessage" class="admin-message"></div>

    </section>

    <section class="admin-section">

        <h2>إدارة الفيديوهات</h2>

        <div class="admin-tabs">

            <button class="active" data-status="pending">
                قيد المراجعة
            </button>

            <button data-status="approved">
                المنشورة
            </button>
<button type="button" data-status="scheduled">
    الفيديوهات المجدولة 📅
</button>
            <button data-status="rejected">
                المرفوضة
            </button>

        </div>

        <div id="adminVideos" class="admin-video-list">
            <div class="admin-empty">
                جارٍ تحميل الفيديوهات...
            </div>
        </div>

    </section>

    <section class="admin-section">

        <h2>إدارة التصنيفات</h2>

        <div id="adminCategories">
            <div class="admin-empty">
                جارٍ تحميل التصنيفات...
            </div>
        </div>

    </section>

</main>

<footer class="site-footer">
    <a href="index.html" class="footer-logo">
        <span>X</span>CITY
    </a>
    <p>لوحة الإدارة © XCITY</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/admin.js"></script>
<script>
const publishMode = document.getElementById("publishMode");
const scheduleDateGroup = document.getElementById("scheduleDateGroup");

publishMode.addEventListener("change", function () {
    scheduleDateGroup.style.display =
        this.value === "scheduled" ? "block" : "none";
});
</script>
</body>
</html>
